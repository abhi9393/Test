version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-ssl
    hostname: rabbitmq
    ports:
      - "5671:5671"    # AMQPS (SSL/TLS)
      - "5672:5672"    # AMQP (plain, optional)
      - "15671:15671"  # Management UI (HTTPS)
      - "15672:15672"  # Management UI (HTTP, optional)
    volumes:
      # Mount certificates
      - ./certs:/etc/rabbitmq/certs:ro
      # Mount configuration
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      # Mount enabled plugins
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # Persist data
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_NODENAME=rabbit@rabbitmq
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - rabbitmq_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
    driver: local

networks:
  rabbitmq_network:
    driver: bridge

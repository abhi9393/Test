###############################################################################
# RabbitMQ Server Configuration for Certificate-based Authentication
# 
# This configuration enables:
# - SSL/TLS listener on port 5671
# - Mutual TLS (client certificate authentication)
# - Certificate-based user authentication
###############################################################################

# ============================================================================
# SSL/TLS Configuration
# ============================================================================

# Enable SSL listener on port 5671 (standard AMQPS port)
listeners.ssl.default = 5671

# Path to server certificate and key
ssl_options.certfile = /path/to/certs/server/cert.pem
ssl_options.keyfile  = /path/to/certs/server/key.pem

# Path to CA certificate (for verifying client certificates)
ssl_options.cacertfile = /path/to/certs/ca/ca_cert.pem

# Require client to present a valid certificate (mutual TLS)
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# SSL protocol versions (disable old insecure versions)
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# Cipher suites (use strong ciphers only)
ssl_options.ciphers.1 = ECDHE-ECDSA-AES256-GCM-SHA384
ssl_options.ciphers.2 = ECDHE-RSA-AES256-GCM-SHA384
ssl_options.ciphers.3 = ECDHE-ECDSA-AES128-GCM-SHA256
ssl_options.ciphers.4 = ECDHE-RSA-AES128-GCM-SHA256

# SSL handshake timeout
ssl_options.handshake_timeout = 5000

# Certificate depth (how many CAs in the chain)
ssl_options.depth = 2

# Honor cipher order
ssl_options.honor_cipher_order = true
ssl_options.honor_ecc_order = true

# ============================================================================
# Authentication Configuration
# ============================================================================

# Enable the auth-mechanism-ssl plugin for certificate-based authentication
# This must be enabled via: rabbitmq-plugins enable rabbitmq_auth_mechanism_ssl

# Authentication backends (order matters!)
# 1. Try certificate-based authentication first
# 2. Fall back to internal database if needed
auth_mechanisms.1 = EXTERNAL
auth_mechanisms.2 = PLAIN

# Use certificate CN (Common Name) as username
# The ssl_cert_login_from variable determines which part of the certificate to use
ssl_cert_login_from = common_name
# Alternatives:
# ssl_cert_login_from = distinguished_name  # Use full DN
# ssl_cert_login_from = subject_alternative_name  # Use SAN

# Authentication backends
auth_backends.1 = rabbit_auth_backend_internal
# For production, you might want:
# auth_backends.1 = rabbit_auth_backend_ldap
# auth_backends.2 = rabbit_auth_backend_internal

# ============================================================================
# Optional: Disable non-SSL listener (for maximum security)
# ============================================================================
# Uncomment to disable the non-SSL listener on port 5672
# listeners.tcp = none

# ============================================================================
# Management Plugin SSL Configuration (if using management plugin)
# ============================================================================
management.tcp.port = 15671
management.ssl.port = 15671
management.ssl.certfile = /path/to/certs/server/cert.pem
management.ssl.keyfile  = /path/to/certs/server/key.pem
management.ssl.cacertfile = /path/to/certs/ca/ca_cert.pem

# ============================================================================
# Logging
# ============================================================================
log.connection.level = info
log.channel.level = info

# ============================================================================
# Virtual Hosts and Permissions
# ============================================================================
# Note: You'll need to create users based on certificate CN and grant permissions
# Example commands (run after RabbitMQ is started):
#
# # Create user matching certificate CN (no password needed for cert auth)
# rabbitmqctl add_user client1 ""
# 
# # Grant permissions
# rabbitmqctl set_permissions -p / client1 ".*" ".*" ".*"
#
# # Set tags if needed
# rabbitmqctl set_user_tags client1 monitoring
